name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs only check out the repo and install from PyPI; none writes back to it.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        # Coverage is reported, not gated, while the bZ4X / Solterra port replaces the command loop. Silver
        # requires >= 95%; add --cov-fail-under=95 here once the port lands (quality_scale.yaml test-coverage).
        run: pytest -q

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install "ruff>=0.15"
      # Scoped to the Python trees: ruff 0.16 also formats code blocks in Markdown, which would make the result
      # depend on the ruff version installed.
      - name: Format check
        run: ruff format --check custom_components tests
      - name: Lint
        run: ruff check custom_components tests

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        # Home Assistant comes in through pytest-homeassistant-custom-component so mypy can resolve it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Type check (component only)
        # Strict config lives in pyproject.toml [tool.mypy]; strict-typing is a Platinum rule.
        run: mypy custom_components
