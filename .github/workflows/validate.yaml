name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # The licence is undecided (CONVERSION.md section 6): upstream has none and the OBD library is GPL-2.0.
          # Remove this once a LICENSE file is added.
          ignore: "license"
